version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  # Tracks the Dockerfile base image. It floats on the Node major
  # (node:26-alpine) so patch releases are picked up automatically; this keeps it
  # moving when a new LTS major lands.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Only LTS lines are supported; never jump to a current/alpha major.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

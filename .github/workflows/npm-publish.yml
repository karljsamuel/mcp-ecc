name: Publish to npm

# Release publication. Publish the internal @mcp-ecc/* packages first (in dependency
# order), then mcp-ecc. Authentication uses npm Trusted Publishing via GitHub
# Actions OIDC; no npm token is stored or required.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to publish (e.g. 0.5.1)'
        required: true
        default: '0.6.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Set version across packages
        id: version
        run: |
          V="${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.version }}"
          V="${V#v}"
          node -e "const r=require('./package.json');r.version='$V';require('fs').writeFileSync('package.json',JSON.stringify(r,null,2)+'\n')"
          find packages -name package.json -not -path '*/node_modules/*' | while read f; do
            node -e "const p=require('./$f');if(!p.private){p.version='$V';require('fs').writeFileSync('$f',JSON.stringify(p,null,2)+'\n')}"
          done
          echo "ver=$V" >> "$GITHUB_OUTPUT"

      - name: Build all packages
        run: npx turbo run build

      - name: Rewrite file deps to npm versions
        run: node scripts/rewrite-file-deps.mjs

      - name: Publish internal @mcp-ecc packages
        run: |
          set -e
          for pkg in \
            packages/core \
            packages/storage/sqlite \
            packages/storage/d1 \
            packages/providers/google \
            packages/providers/microsoft \
            packages/providers/zoho \
            packages/providers/imap-smtp \
            packages/providers/caldav \
            packages/providers/carddav \
            packages/mcp-server \
            packages/management-api; do
            echo "publishing $pkg"
            npm publish "./$pkg" --access public --provenance
          done

      - name: Publish entry package
        run: npm publish ./packages/cli --access public --provenance

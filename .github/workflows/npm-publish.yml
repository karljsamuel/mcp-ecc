name: Publish to npm & MCP Registry

# Manual release. Publish the internal @mcp-ecc/* packages first (in dependency
# order), then @karljsamuel/mcp-ecc. Requires repo secrets NPM_TOKEN (npm) and a
# one-time `mcp-publisher login github` for the MCP Registry (run locally).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to publish (e.g. 0.4.0-beta.1)'
        required: true
        default: '0.4.0-beta.1'
      to_mcp_registry:
        description: 'Also publish to the MCP Registry (needs mcp-publisher)'
        required: false
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Update npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Set version across packages
        id: version
        run: |
          V="${{ github.event.inputs.version }}"
          node -e "const r=require('./package.json');r.version='$V';require('fs').writeFileSync('package.json',JSON.stringify(r,null,2)+'\n')"
          find packages -name package.json -not -path '*/node_modules/*' | while read f; do
            node -e "const p=require('./$f');if(!p.private){p.version='$V';require('fs').writeFileSync('$f',JSON.stringify(p,null,2)+'\n')}"
          done
          echo "ver=$V" >> "$GITHUB_OUTPUT"

      - name: Build all packages
        run: npx turbo run build

      - name: Rewrite file deps to npm versions
        run: node scripts/rewrite-file-deps.mjs

      - name: Publish internal @mcp-ecc packages
        run: |
          set -e
          for pkg in \
            packages/core \
            packages/storage/memory \
            packages/storage/sqlite \
            packages/storage/d1 \
            packages/providers/google \
            packages/providers/microsoft \
            packages/providers/zoho \
            packages/providers/imap-smtp \
            packages/providers/caldav \
            packages/providers/carddav \
            packages/mcp-server \
            packages/management-api; do
            echo "publishing $pkg"
            npm publish "./$pkg" --access public --tag beta --provenance
          done

      - name: Publish entry package
        run: npm publish ./packages/cli --access public --tag beta --provenance

      - name: Publish to MCP Registry
        if: ${{ github.event.inputs.to_mcp_registry == 'true' }}
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher && sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher login github-oidc
          mcp-publisher publish
name: Publish to npm

# Release publication. Publish the internal @mcp-ecc/* packages first (in dependency
# order), then mcp-ecc. Authentication uses npm Trusted Publishing via GitHub
# Actions OIDC; no npm token is stored or required.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to publish (e.g. 0.7.0)'
        required: true
        default: '0.7.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Set version across packages
        id: version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.version }}
        run: |
          V="$RELEASE_VERSION"
          V="${V#v}"
          [[ "$V" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || { echo "Invalid SemVer: $V" >&2; exit 1; }
          VERSION="$V" node -e "const fs=require('fs'),r=require('./package.json');r.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(r,null,2)+'\n')"
          find packages -name package.json -not -path '*/node_modules/*' | while read f; do
            PACKAGE_FILE="$f" VERSION="$V" node -e "const fs=require('fs'),path=require('path'),f=process.env.PACKAGE_FILE,p=require('./'+f);if(!p.private){p.version=process.env.VERSION;p.repository={type:'git',url:'https://github.com/karljsamuel/mcp-ecc.git',directory:path.dirname(f)};fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')}"
          done
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          if [[ "$V" == *-* ]]; then
            # Sanitize prerelease tag: npm rejects numeric-only tags
            PRERELEASE="${V#*-}"
            if [[ "$PRERELEASE" =~ ^[0-9]+$ ]]; then
              PRERELEASE="prerelease-$PRERELEASE"
            fi
            echo "npm_tag=$PRERELEASE" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Clean first: composite/incremental tsc trusts .tsbuildinfo, so a stale one
      # surviving without its dist/ makes tsc emit nothing and silently produce an
      # empty package that still "builds".
      - name: Build all packages
        run: npm run clean && npm run build

      # Never publish unverified. These suites consume the built dist output, so
      # they must run after the build. Fail loudly if either suite family is
      # missing: node --test treats an unmatched glob as a passing no-op.
      - name: Run test suites
        run: |
          shopt -s nullglob
          cjs=(tests/*.test.cjs)
          mjs=(tests/*.test.mjs)
          if [ ${#cjs[@]} -eq 0 ] || [ ${#mjs[@]} -eq 0 ]; then
            echo "::error::Expected at least one tests/*.test.cjs and one tests/*.test.mjs suite; found cjs=${#cjs[@]} mjs=${#mjs[@]}. Refusing to publish unverified."
            exit 1
          fi
          node --test tests/*.test.cjs tests/*.test.mjs

      - name: Rewrite file deps to npm versions
        run: node scripts/rewrite-file-deps.mjs

      - name: Publish internal @mcp-ecc packages
        # The tag travels via env, never interpolated into the shell text, so a
        # step output can't become part of the command line.
        env:
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
        run: |
          set -e
          for pkg in \
            packages/core \
            packages/storage/sqlite \
            packages/storage/d1 \
            packages/providers/google \
            packages/providers/microsoft \
            packages/providers/zoho \
            packages/providers/imap-smtp \
            packages/providers/caldav \
            packages/providers/carddav \
            packages/mcp-server \
            packages/management-api; do
            echo "publishing $pkg"
            npm publish "./$pkg" --access public --provenance --tag "$NPM_TAG"
          done

      - name: Publish entry package
        env:
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
        run: npm publish ./packages/cli --access public --provenance --tag "$NPM_TAG"
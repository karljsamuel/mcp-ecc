# mcp-ecc single-container compose example.
# Copy to docker-compose.yml (or run `docker compose -f docker-compose.example.yml up -d`)
# after filling .env from .env.example.
#
# One container runs the Management API which serves:
#   - Web UI        http://localhost:3001
#   - REST/OAuth    http://localhost:3001/api/*, /oauth/*
#   - MCP endpoint  http://localhost:3001/mcp  (Streamable HTTP)

services:
  mcp-ecc:
    # Prebuilt image from GHCR (pushed by the publish workflow on v* tags / main).
    # Use a specific tag for a pinned build, e.g. ghcr.io/karljsamuel/mcp-ecc:0.2.0
    image: ghcr.io/karljsamuel/mcp-ecc:latest
    # To build locally instead of pulling, uncomment the following and remove the image line:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: mcp-ecc
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      MCP_ENCRYPTION_KEY: ${MCP_ENCRYPTION_KEY}
      # Google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Microsoft / Office 365
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID}
      # Zoho
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET}
      # Server
      BASE_URL: ${BASE_URL:-http://localhost:3001}
      PORT: "3001"
      HOST: "0.0.0.0"
      MCP_STORAGE_FILE: /data/mcp-ecc.db
    volumes:
      # Persist encrypted credentials + SQLite data on the host
      - ./data:/data
    # Resource safety (adjust to your needs)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
    #       cpus: "1.0"
